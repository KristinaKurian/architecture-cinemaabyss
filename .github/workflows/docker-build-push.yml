name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build-push.yml"
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start the application
        run: docker compose up -d --build

      - name: Wait for services
        shell: bash
        run: |
          set -euo pipefail
          endpoints=(
            "http://127.0.0.1:8080/health"
            "http://127.0.0.1:8081/api/movies/health"
            "http://127.0.0.1:8082/api/events/health"
            "http://127.0.0.1:8000/health"
          )
          for endpoint in "${endpoints[@]}"; do
            for attempt in {1..60}; do
              if curl --fail --silent "$endpoint" >/dev/null; then
                echo "Ready: $endpoint"
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                docker compose ps
                docker compose logs
                exit 1
              fi
              sleep 2
            done
          done

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/postman/package-lock.json

      - name: Install test dependencies
        working-directory: tests/postman
        run: npm ci

      - name: Run Postman tests
        working-directory: tests/postman
        run: npm run test:local

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v

  build-and-push:
    name: Build ${{ matrix.service }}
    needs: api-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: monolith
            context: ./src/monolith
          - service: movies-service
            context: ./src/microservices/movies
          - service: events-service
            context: ./src/microservices/events
          - service: proxy-service
            context: ./src/microservices/proxy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=${repository}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
